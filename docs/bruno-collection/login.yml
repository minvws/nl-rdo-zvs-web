info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/login"
  body:
    type: json
    data: |
      { 
        "api_key": "{{api_key}}",
        "api_secret": "{{api_secret}}"
      } 

runtime:
  scripts:
    - type: after-response
      code: |-
        // Stores the access_token in an environment variable
        let accessToken = '';
        try {
            accessToken = res.getBody().access_token;
            bru.setEnvVar("access_token", accessToken);
        } catch (JSONError) {
            console.error("Failed to parse JSON response:", JSONError);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
