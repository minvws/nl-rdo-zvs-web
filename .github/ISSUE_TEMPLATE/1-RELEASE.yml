name: Release ticket
description: Create a release ticket for ZVS-WEB (in English).
title: "ZVS: release [VUL TAG IN] naar PROD"
labels: ["release"]
projects: ["minvws/66"]
body:
  - type: input
    attributes:
      label: "Current version ZVS-WEB on PROD:"
      placeholder: v1.6.0
  - type: input
    attributes:
      label: "New version ZVS-WEB on PROD:"
      placeholder: v1.6.1
  - type: checkboxes
    attributes:
      label: Database updates required?
      options:
      - label: 'Yes'
      - label: 'No'
  - type: textarea
    attributes:
      label: 'Actions required before, during or right after deployment:'
  - type: textarea
    attributes:
      label: 'Tickets in release:'
  - type: textarea
    attributes:
      label: 'Checklist'
      value: Copy checklist content from https://github.com/minvws/nl-rdo-quality-coordination/blob/main/Projectdocumentatie/Templates/Release%20Checklist.md
