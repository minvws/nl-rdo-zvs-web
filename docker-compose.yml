services:
    laravel.test: &app
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - mailpit
            - clamav
            - minio-setup

    pgsql: &db
        image: 'postgres:15'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    clamav:
        image: 'clamav/clamav'
        networks:
            - sail
        platform: 'linux/amd64'

    laravel.robot:
        <<: *app
        container_name: laravel.robot
        env_file:
            - ./.env.robot
        depends_on:
            - pgsql-robot
            - mailpit
            - clamav
            - minio-setup

    pgsql-robot:
        <<: *db
        container_name: pgsql-robot
        env_file:
            - ./.env.robot
        volumes:
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'

    e2e-tests:
        build:
            context: .
            dockerfile: robot/Dockerfile
        command: >
            uv run robot
            --exclude SKIP
            --console verbose
            tests/
        networks:
            - sail
        depends_on:
            - laravel.robot
        environment:
            - RUNNING_IN_CONTAINER=true
            - MAILPIT_API_BASE_URL=http://mailpit:8025
        env_file:
            - ./.env.robot
        volumes:
            - ./robot:/app/robot
            - /var/run/docker.sock:/var/run/docker.sock:ro

    minio:
        image: 'minio/minio:RELEASE.2025-02-28T09-55-16Z'
        container_name: minio
        ports:
            - '${MINIO_PORT:-9000}:9000'
            - '${MINIO_CONSOLE_PORT:-9001}:9001'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-minioadmin}'
        volumes:
            - 'sail-minio:/minio_root'
        networks:
            - sail
        command: minio server /minio_root --console-address ":9001"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
            interval: 30s
            timeout: 20s
            retries: 3

    minio-setup:
        image: sail-8.4/app
        depends_on:
            minio:
                condition: service_healthy
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                php artisan minio:setup
                exit 0

networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-pgsql:
        driver: local
    sail-minio:
        driver: local
